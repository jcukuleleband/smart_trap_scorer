name: Publish draft PWA to Pages
on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pwa-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pwa-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test && npm run build:pages
        working-directory: pwa
        env:
          PWA_API_BASE_URL: ${{ vars.PWA_API_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
